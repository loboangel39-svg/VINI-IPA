name = "vini-patch-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "VINI_DB"
database_name = "vini-patch-db"
database_id = "d1aaf8bf-fa01-4e2e-8c70-48c3864d1ab7"

# R2 Bucket for patch storage
[[r2_buckets]]
binding = "VINI_PATCHES"
bucket_name = "vini-patches"

# KV Namespace for remote config
[[kv_namespaces]]
binding = "VINI_CONFIG"
id = "2c4f3b9e49904314a143bf03f7b5ca83"

# Secrets (set via wrangler secret put)
# ADMIN_PASSWORD_HASH
# JWT_SECRET
# GITHUB_TOKEN
