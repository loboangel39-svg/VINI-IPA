<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINI Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal { display: none; }
        .modal.active { display: flex; }
        .sidebar { width: 260px; transition: all 0.3s; }
        .sidebar.collapsed { width: 70px; }
        .sidebar.collapsed .sidebar-text { display: none; }
        .main-content { margin-left: 260px; transition: all 0.3s; }
        .main-content.expanded { margin-left: 70px; }
        .nav-item { transition: all 0.2s; cursor: pointer; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.2); border-left: 3px solid white; }
        .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #667eea; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="bg-gray-100">

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center gradient-bg">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md fade-in">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-shield-alt text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">VINI Super Admin</h1>
            <p class="text-gray-500 mt-2">Panel de Control</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Usuario</label>
                <input type="text" id="loginUsername" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500" placeholder="admin">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                <input type="password" id="loginPassword" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500" placeholder="••••••••">
            </div>
            <div id="loginError" class="text-red-500 text-sm hidden"></div>
            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:opacity-90">
                <i class="fas fa-sign-in-alt mr-2"></i>Acceder
            </button>
        </form>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full gradient-bg text-white z-40 overflow-y-auto">
        <div class="p-4">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <span class="sidebar-text font-bold text-lg">VINI Admin</span>
            </div>
            <nav class="space-y-1" id="sidebarNav">
                <a data-section="dashboard" class="nav-item active flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-chart-line w-5"></i><span class="sidebar-text">Dashboard</span>
                </a>
                <a data-section="patches" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-puzzle-piece w-5"></i><span class="sidebar-text">Patches</span>
                </a>
                <a data-section="users" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-users w-5"></i><span class="sidebar-text">Usuarios</span>
                </a>
                <a data-section="licenses" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-key w-5"></i><span class="sidebar-text">Licencias</span>
                </a>
                <a data-section="messages" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-envelope w-5"></i><span class="sidebar-text">Mensajes</span>
                </a>
                <a data-section="features" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-toggle-on w-5"></i><span class="sidebar-text">Features</span>
                </a>
                <a data-section="banners" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-flag w-5"></i><span class="sidebar-text">Banners</span>
                </a>
                <a data-section="versions" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-code-branch w-5"></i><span class="sidebar-text">Versiones</span>
                </a>
                <a data-section="analytics" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-chart-bar w-5"></i><span class="sidebar-text">Analíticas</span>
                </a>
                <a data-section="logs" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-list-alt w-5"></i><span class="sidebar-text">Logs</span>
                </a>
                <a data-section="security" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-lock w-5"></i><span class="sidebar-text">Seguridad</span>
                </a>
                <a data-section="webhooks" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-plug w-5"></i><span class="sidebar-text">Webhooks</span>
                </a>
                <a data-section="maintenance" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-wrench w-5"></i><span class="sidebar-text">Mantenimiento</span>
                </a>
                <a data-section="settings" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-cog w-5"></i><span class="sidebar-text">Config</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <div id="mainContent" class="main-content min-h-screen">
        <!-- Top Bar -->
        <header class="bg-white shadow-sm border-b sticky top-0 z-30">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-bars text-xl"></i></button>
                    <h1 id="sectionTitle" class="text-xl font-bold text-gray-800">Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600">Admin</span>
                    <button onclick="logout()" class="text-gray-500 hover:text-red-600"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="p-6" id="contentArea"></div>
    </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

<!-- Modals Container -->
<div id="modalContainer"></div>

<script>
// ========== CONFIG ==========
const API = 'https://vini-patch-worker.loboangel39.workers.dev';
let authToken = localStorage.getItem('adminToken');
let currentUser = JSON.parse(localStorage.getItem('adminUser') || 'null');
let charts = {};
let data = { patches: [], users: [], licenses: [], messages: [], banners: [], versions: [], logs: [], webhooks: [], features: {}, settings: {} };

function generateLicenseKey(prefix = '', length = 12) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    const array = new Uint8Array(length);
    crypto.getRandomValues(array);
    for (let i = 0; i < length; i++) {
        result += chars[array[i] % chars.length];
    }
    const formatted = result.match(/.{1,4}/g).join('-');
    return prefix ? `${prefix}-${formatted}` : formatted;
}

// ========== INIT ==========
if (authToken && currentUser) showApp();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('loginUsername').value;
    const p = document.getElementById('loginPassword').value;
    try {
        const res = await fetch(`${API}/api/admin/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
        const d = await res.json();
        if (d.token) { authToken = d.token; currentUser = d.admin; localStorage.setItem('adminToken', authToken); localStorage.setItem('adminUser', JSON.stringify(currentUser)); showApp(); }
        else { document.getElementById('loginError').textContent = 'Credenciales inválidas'; document.getElementById('loginError').classList.remove('hidden'); }
    } catch (err) { document.getElementById('loginError').textContent = 'Error de conexión: ' + err.message; document.getElementById('loginError').classList.remove('hidden'); }
});

function showApp() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    setupNav();
    loadAll();
    setInterval(loadAll, 30000);
}

function logout() { authToken = null; currentUser = null; localStorage.clear(); location.reload(); }

// ========== NAV ==========
function setupNav() {
    document.querySelectorAll('#sidebarNav .nav-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('#sidebarNav .nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            showSection(item.dataset.section);
        });
    });
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('mainContent').classList.toggle('expanded');
}

// ========== SECTIONS ==========
const sectionTitles = { dashboard:'Dashboard', patches:'Patches', users:'Usuarios', licenses:'Licencias', messages:'Mensajes', features:'Feature Flags', banners:'Banners', versions:'Versiones', analytics:'Analíticas', logs:'Logs', security:'Seguridad', webhooks:'Webhooks', maintenance:'Mantenimiento', settings:'Configuración' };

function showSection(name) {
    document.getElementById('sectionTitle').textContent = sectionTitles[name] || name;
    const area = document.getElementById('contentArea');
    const renderers = { dashboard: renderDashboard, patches: renderPatches, users: renderUsers, licenses: renderLicenses, messages: renderMessages, features: renderFeatures, banners: renderBanners, versions: renderVersions, analytics: renderAnalytics, logs: renderLogs, security: renderSecurity, webhooks: renderWebhooks, maintenance: renderMaintenance, settings: renderSettings };
    if (renderers[name]) renderers[name](area);
}

// ========== API HELPER ==========
async function api(path, opts = {}) {
    const headers = { 'Authorization': `Bearer ${authToken}`, ...opts.headers };
    if (!(opts.body instanceof FormData) && opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch(`${API}${path}`, { ...opts, headers, body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined });
    return res;
}

// ========== LOAD ALL ==========
async function loadAll() {
    try {
        const [p, u, l, m, s, r] = await Promise.all([
            api('/api/patches').then(r => r.json()).catch(() => []),
            api('/api/users').then(r => r.json()).catch(() => []),
            api('/api/licenses').then(r => r.json()).catch(() => []),
            api('/api/messages').then(r => r.json()).catch(() => []),
            api('/api/stats').then(r => r.json()).catch(() => ({})),
            api('/api/config').then(r => r.json()).catch(() => ({}))
        ]);
        data.patches = p; data.users = u; data.licenses = l; data.messages = m; data.stats = s;
        data.features = r.featureFlags || {}; data.settings = r.settings || {};
        try { data.banners = await api('/api/banners').then(r => r.json()); } catch(e) { data.banners = []; }
        try { data.versions = await api('/api/versions').then(r => r.json()); } catch(e) { data.versions = []; }
        try { data.webhooks = await api('/api/webhooks').then(r => r.json()); } catch(e) { data.webhooks = []; }
    } catch(e) { console.error('Load error:', e); }
}

// ========== DASHBOARD ==========
function renderDashboard(area) {
    const s = data.stats;
    area.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="rounded-xl p-6 text-white card-hover" style="background:linear-gradient(135deg,#667eea,#764ba2)">
                <div class="flex items-center justify-between"><div><p class="text-sm opacity-80">Usuarios</p><p class="text-3xl font-bold mt-2">${s.totalUsers||0}</p></div><i class="fas fa-users text-4xl opacity-30"></i></div>
            </div>
            <div class="rounded-xl p-6 text-white card-hover" style="background:linear-gradient(135deg,#11998e,#38ef7d)">
                <div class="flex items-center justify-between"><div><p class="text-sm opacity-80">Licencias</p><p class="text-3xl font-bold mt-2">${s.totalLicenses||0}</p></div><i class="fas fa-key text-4xl opacity-30"></i></div>
            </div>
            <div class="rounded-xl p-6 text-white card-hover" style="background:linear-gradient(135deg,#f093fb,#f5576c)">
                <div class="flex items-center justify-between"><div><p class="text-sm opacity-80">Patches</p><p class="text-3xl font-bold mt-2">${s.totalPatches||0}</p></div><i class="fas fa-puzzle-piece text-4xl opacity-30"></i></div>
            </div>
            <div class="rounded-xl p-6 text-white card-hover" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">
                <div class="flex items-center justify-between"><div><p class="text-sm opacity-80">Descargas</p><p class="text-3xl font-bold mt-2">${s.totalDownloads||0}</p></div><i class="fas fa-download text-4xl opacity-30"></i></div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow p-6"><h3 class="text-lg font-bold mb-4">Actividad (24h)</h3><canvas id="chartActivity" height="200"></canvas></div>
            <div class="bg-white rounded-xl shadow p-6"><h3 class="text-lg font-bold mb-4">Dispositivos</h3><canvas id="chartDevices" height="200"></canvas></div>
        </div>
        <div class="bg-white rounded-xl shadow p-6">
            <h3 class="text-lg font-bold mb-4">Eventos Recientes</h3>
            <div id="recentEvents" class="space-y-2">${(s.recentEvents||[]).map(e => `<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg"><div class="flex items-center space-x-3"><i class="fas fa-circle text-purple-500 text-xs"></i><span class="font-medium">${e.event_type}</span></div><span class="text-sm text-gray-500">${e.count} veces</span></div>`).join('') || '<p class="text-gray-500 text-center py-4">Sin eventos</p>'}</div>
        </div>`;
    loadCharts();
}

async function loadCharts() {
    try {
        const rt = await api('/api/stats/realtime').then(r => r.json());
        const actCtx = document.getElementById('chartActivity');
        if (actCtx && rt.hourlyActivity) {
            if (charts.act) charts.act.destroy();
            charts.act = new Chart(actCtx, { type:'line', data:{ labels:rt.hourlyActivity.map(h=>new Date(h.hour).toLocaleTimeString('es',{hour:'2-digit'})), datasets:[{label:'Eventos',data:rt.hourlyActivity.map(h=>h.events),borderColor:'#667eea',backgroundColor:'rgba(102,126,234,0.1)',tension:0.4,fill:true}] }, options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}} });
        }
        const devCtx = document.getElementById('chartDevices');
        if (devCtx && rt.deviceBreakdown) {
            if (charts.dev) charts.dev.destroy();
            charts.dev = new Chart(devCtx, { type:'doughnut', data:{ labels:rt.deviceBreakdown.map(d=>`${d.device_model||'?'} iOS ${d.ios_version||'?'}`), datasets:[{data:rt.deviceBreakdown.map(d=>d.count),backgroundColor:['#667eea','#764ba2','#f093fb','#f5576c','#38ef7d','#4facfe']}] }, options:{responsive:true,plugins:{legend:{position:'bottom'}}} });
        }
    } catch(e) {}
}

// ========== PATCHES ==========
function renderPatches(area) {
    area.innerHTML = `
        <div class="flex justify-between items-center mb-6">
            <div><h2 class="text-2xl font-bold">Gestión de Patches</h2><p class="text-gray-500">Crea y distribuye patches</p></div>
            <button onclick="showModal('patch')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700"><i class="fas fa-plus mr-2"></i>Nuevo Patch</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${data.patches.length === 0 ? '<div class="col-span-3 text-center py-12"><i class="fas fa-puzzle-piece text-4xl text-gray-300 mb-4"></i><p class="text-gray-500">No hay patches</p></div>' :
            data.patches.map(p => `
                <div class="bg-white rounded-xl shadow card-hover p-6">
                    <div class="flex justify-between items-start mb-3"><div><h3 class="text-lg font-bold">${p.name}</h3><p class="text-sm text-gray-500">${p.bundle_id}</p></div><span class="px-2 py-1 text-xs bg-purple-100 text-purple-800 rounded-full">v${p.version}</span></div>
                    <p class="text-sm text-gray-600 mb-3">${p.description||'Sin descripción'}</p>
                    <div class="flex items-center justify-between text-sm text-gray-500 mb-4"><span><i class="fas fa-download mr-1"></i>${p.downloads||0}</span><span>${new Date(p.created_at).toLocaleDateString()}</span></div>
                    <div class="flex space-x-2">
                        <button onclick="pushGitHub('${p.id}')" class="flex-1 bg-green-50 text-green-600 py-2 rounded-lg text-sm font-medium hover:bg-green-100"><i class="fab fa-github mr-1"></i>GitHub</button>
                        <button onclick="deletePatch('${p.id}')" class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-100"><i class="fas fa-trash mr-1"></i>Eliminar</button>
                    </div>
                </div>`).join('')}
        </div>`;
}

async function deletePatch(id) { if (!confirm('¿Eliminar?')) return; await api(`/api/patches/${id}`, {method:'DELETE'}); toast('Eliminado','success'); await loadAll(); showSection('patches'); }
async function pushGitHub(id) { toast('Subiendo...','info'); const r = await api(`/api/patches/${id}/push-github`, {method:'POST'}); if (r.ok) toast('Subido a GitHub','success'); else toast('Error','error'); }

// ========== USERS ==========
function renderUsers(area) {
    area.innerHTML = `
        <div class="flex justify-between items-center mb-6"><div><h2 class="text-2xl font-bold">Usuarios</h2><p class="text-gray-500">${data.users.length} registrados</p></div>
        <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"><i class="fas fa-download mr-2"></i>Exportar CSV</button></div>
        
        <!-- Búsqueda por licencia -->
        <div class="bg-white rounded-xl shadow p-4 mb-4">
            <div class="flex items-center space-x-2">
                <i class="fas fa-search text-gray-400"></i>
                <input type="text" id="searchLicense" placeholder="Buscar por licencia..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" onkeyup="filterUsersByLicense()">
                <button onclick="clearUserSearch()" class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">Limpiar</button>
            </div>
            <p class="text-xs text-gray-500 mt-2">Ingresa una licencia completa o parcial para filtrar usuarios</p>
        </div>
        
        <div class="bg-white rounded-xl shadow overflow-hidden"><table class="min-w-full"><thead class="bg-gray-50"><tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">HWID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Licencia</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Dispositivo</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">iOS</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Patches</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Estado</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Última Vez</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acciones</th>
        </tr></thead><tbody id="usersTableBody" class="divide-y divide-gray-200">
            ${renderUsersTable(data.users)}
        </tbody></table></div>`;
}

function renderUsersTable(users) {
    if (users.length === 0) {
        return '<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">No hay usuarios</td></tr>';
    }
    return users.map(u => {
        const license = data.licenses.find(l => l.key === u.license_key);
        const licenseDisplay = license ? `<span class="font-mono text-xs">${license.key.substring(0, 12)}...</span>` : '<span class="text-gray-400 text-xs">N/A</span>';
        return `<tr class="hover:bg-gray-50 user-row" data-license="${u.license_key || ''}">
            <td class="px-6 py-4 text-sm font-mono">${u.hwid.substring(0,12)}...</td>
            <td class="px-6 py-4">${licenseDisplay}</td>
            <td class="px-6 py-4 text-sm">${u.device_model||'-'}</td>
            <td class="px-6 py-4 text-sm">${u.ios_version||'-'}</td>
            <td class="px-6 py-4"><span class="px-2 py-1 bg-purple-100 text-purple-800 rounded-full text-xs">${(u.patches||[]).length}</span></td>
            <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-medium ${u.active?'bg-green-100 text-green-800':'bg-red-100 text-red-800'} rounded-full">${u.active?'Activo':'Inactivo'}</span></td>
            <td class="px-6 py-4 text-sm text-gray-500">${u.last_seen_at?new Date(u.last_seen_at).toLocaleString('es'):'Nunca'}</td>
            <td class="px-6 py-4 text-sm">
                <button onclick="assignPatches('${u.hwid}')" class="text-purple-600 hover:text-purple-800 mr-2" title="Asignar patches"><i class="fas fa-puzzle-piece"></i></button>

function filterUsersByLicense() {
    const searchTerm = document.getElementById('searchLicense').value.toLowerCase();
    const rows = document.querySelectorAll('.user-row');
    
    if (!searchTerm) {
        rows.forEach(row => row.style.display = '');
        return;
    }
    
    rows.forEach(row => {
        const license = row.getAttribute('data-license').toLowerCase();
        if (license.includes(searchTerm)) {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
}

function clearUserSearch() {
    document.getElementById('searchLicense').value = '';
    filterUsersByLicense();
}

async function assignPatchesToLicense(licenseKey) {
    const license = data.licenses.find(l => l.key === licenseKey);
    if (!license) { toast('Licencia no encontrada','error'); return; }
    
    // Obtener el usuario vinculado a esta licencia
    const user = data.users.find(u => u.license_key === licenseKey);
    if (!user) { toast('Esta licencia no está vinculada a ningún usuario','error'); return; }
    
    // Abrir modal de asignación
    openAssignPatchesModal(user.hwid, user);
}

function openAssignPatchesModal(hwid, user) {
    const userPatches = user.patches || [];
    const modal = document.createElement('div');
    modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
    modal.innerHTML = `
        <div class="bg-white rounded-xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">

                        <input type="checkbox" value="${patch.id}" ${userPatches.includes(patch.id) ? 'checked' : ''} class="patch-checkbox w-4 h-4">
                        <div class="flex-1">
                            <div class="font-medium">${patch.name}</div>
                            <div class="text-xs text-gray-500">${patch.bundle_id} - v${patch.version}</div>
                        </div>
                    </label>
                `).join('')}
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="this.closest('.fixed').remove()" class="px-4 py-2 bg-gray-200 rounded-lg">Cancelar</button>
                <button onclick="savePatchAssignment('${hwid}')" class="px-4 py-2 bg-purple-600 text-white rounded-lg">Guardar</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

async function savePatchAssignment(hwid) {
    const checkboxes = document.querySelectorAll('.patch-checkbox:checked');
    const patchIds = Array.from(checkboxes).map(cb => cb.value);
    
    try {
        const res = await fetch(`${API_BASE}/api/users/${hwid}/patches`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ patchIds })
        });
        
        if (res.ok) {
            toast('Patches asignados correctamente','success');
            document.querySelector('.fixed').remove();
            await loadAll();
        } else {
            toast('Error al asignar patches','error');
        }
    } catch (err) {
        console.error('Error:', err);
        toast('Error de conexión','error');
    }
}

async function loadMaintData() { try { const d=await api('/api/maintenance').then(r=>r.json()); document.getElementById('maintToggle').checked=d.enabled||false; document.getElementById('maintMsg').value=d.message||''; document.getElementById('maintWL').value=(d.whitelist||[]).join(', '); document.getElementById('maintConfig').classList.toggle('hidden',!d.enabled); } catch(e) {} }
function toggleMaint() { document.getElementById('maintConfig').classList.toggle('hidden',!document.getElementById('maintToggle').checked); }
async function saveMaint() { await api('/api/maintenance',{method:'POST',body:{enabled:document.getElementById('maintToggle').checked,message:document.getElementById('maintMsg').value,whitelist:document.getElementById('maintWL').value.split(',').map(s=>s.trim()).filter(s=>s)}}); toast('Guardado','success'); }

// ========== SUBMIT HANDLERS ==========
async function submitPatch() {
    const form = document.querySelector('#modalForm');
    const fd = new FormData();
    fd.append('name', form.name.value);
    fd.append('bundleId', form.bundleId.value);
    fd.append('version', form.version.value);
    fd.append('description', form.description.value);
    fd.append('password', form.password.value);
    fd.append('file', form.file.files[0]);
    const r = await api('/api/patches', {method:'POST', body:fd});
    if (r.ok) { toast('Patch creado','success'); document.querySelector('.modal')?.remove(); await loadAll(); showSection('patches'); } else toast('Error','error');
}

async function submitLicense() {
    const prefix = document.getElementById('licPrefix').value.trim().toUpperCase();
    const days = parseInt(document.getElementById('licDays').value);
    const key = generateLicenseKey(prefix);
    const r = await api('/api/licenses', {method:'POST', body:{validDays:days, customKey:key}});
    if (r.ok) { toast('Licencia: ' + key,'success'); document.querySelector('.modal')?.remove(); await loadAll(); showSection('licenses'); } else toast('Error','error');
}

async function submitBulk() {
    const prefix = document.getElementById('bulkPrefix').value.trim().toUpperCase();
    const n = parseInt(document.getElementById('bulkN').value);
    const days = parseInt(document.getElementById('bulkD').value);
    toast(`Generando ${n} licencias...`, 'info');
    let successCount = 0;
    for (let i = 0; i < n; i++) {
        try {
            const key = generateLicenseKey(prefix);
            const r = await api('/api/licenses', {method:'POST', body:{validDays:days, customKey:key}});
            if (r.ok) successCount++;
        } catch(e) {
            console.error('Error generating license:', e);
        }
    }
    toast(`${successCount}/${n} licencias generadas`, successCount === n ? 'success' : 'info');
    document.querySelector('.modal')?.remove();
    await loadAll(); showSection('licenses');
}

async function submitMsg() {
    const r = await api('/api/messages', {method:'POST', body:{title:document.getElementById('msgT').value,content:document.getElementById('msgC').value,type:document.getElementById('msgTy').value,targetHwid:document.getElementById('msgTg').value||null}});
    if (r.ok) { toast('Enviado','success'); document.querySelector('.modal')?.remove(); await loadAll(); showSection('messages'); } else toast('Error','error');
}

async function submitBanner() {
    const r = await api('/api/banners', {method:'POST', body:{title:document.getElementById('banT').value,text:document.getElementById('banTx').value,color:document.getElementById('banC').value,position:document.getElementById('banP').value}});
    if (r.ok) { toast('Banner creado','success'); document.querySelector('.modal')?.remove(); await loadAll(); showSection('banners'); } else toast('Error','error');
}

async function submitVersion() {
    const r = await api('/api/versions', {method:'POST', body:{version:document.getElementById('verN').value,min_ios:document.getElementById('verMin').value,max_ios:document.getElementById('verMax').value,changelog:document.getElementById('verCL').value,download_url:document.getElementById('verURL').value,force_update:document.getElementById('verForce').checked}});
    if (r.ok) { toast('Versión creada','success'); document.querySelector('.modal')?.remove(); await loadAll(); showSection('versions'); } else toast('Error','error');

async function submitWebhook() {
    const events = Array.from(document.querySelectorAll('.wh-ev:checked')).map(cb=>cb.value);
    const r = await api('/api/webhooks', {method:'POST', body:{name:document.getElementById('whN').value,url:document.getElementById('whU').value,events}});
    if (r.ok) { toast('Webhook creado','success'); document.querySelector('.modal')?.remove(); await loadAll(); showSection('webhooks'); } else toast('Error','error');
}

// ========== TOAST ==========
function toast(msg, type='info') {
    const colors = {success:'bg-green-500',error:'bg-red-500',info:'bg-blue-500'};
    const icons = {success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle'};
    const t = document.createElement('div');
    t.className = `toast ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3`;
    t.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(()=>t.remove(),300); }, 3000);
}
