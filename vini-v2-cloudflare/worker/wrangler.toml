name = "vini-v2-api"
main = "index.js"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "vini-v2-db"
database_id = "3f0d818b-0648-43f9-9dbe-3ffca38d2035"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "vini-patches"

# Environment Variables (set these in Cloudflare Dashboard or via wrangler secret)
[vars]
ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD = "set-via-wrangler-secret"
# JWT_SECRET = "set-via-wrangler-secret"
